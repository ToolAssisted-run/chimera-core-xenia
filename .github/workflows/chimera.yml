name: chimera waterbox core

# Builds the core from a fresh clone, tests it, and publishes the package.
#
# What is tested here is less than what is tested before a push. No Xbox 360
# game may be put on a public runner, and every test that runs a game is
# skipped here (the test script says SKIP for each). What does run here:
#   - everything builds from the fixed upstream commit with the patches applied;
#   - Xenia's own instruction tests in the sandbox give the native build's
#     results (4,460 tests);
#   - Chimera's own checks of the package: it loads, and what it declares
#     (controllers, settings, file types) is well formed.
# The tests with a game are run where the game is: docs/BUILDING.md.

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      kind:
        description: 'dev (rolling) or nightly (dated). Blank means dev.'
        required: false
        default: ''
        type: string
  schedule:
    # 04:40 UTC. A nightly is published only when main moved since the last
    # one; the shared publishing workflow checks.
    - cron: '40 4 * * *'

# Keyed by the event as well as the branch: otherwise the nightly schedule
# and a push to main cancel each other, and the publishing that depends on
# the cancelled run is skipped with nothing reporting a failure.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CHIMERA_REF: main

jobs:

  gate:
    name: build and test (package, instruction tests, Chimera's package checks)
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v6

      - name: Check out Xenia and its libraries
        # Xenia's libraries are its own submodules. One level is enough.
        run: |
          git submodule update --init
          git -C extern/xenia submodule update --init --depth 1

      - name: Check out Chimera
        uses: actions/checkout@v6
        with:
          repository: ToolAssisted-run/chimera
          ref: ${{ env.CHIMERA_REF }}
          path: chimera-checkout
          submodules: recursive

      - name: Install build dependencies
        # The lib*-dev packages are what Chimera's own build needs; this core
        # needs none of them. gcc-13 is for the PowerPC assembler the
        # instruction tests are built with (binutils 2.24, which newer
        # compilers refuse).
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends meson ninja-build build-essential cmake pkg-config python3 curl flex bison texinfo gcc-13 gcc-14 g++-14 libgl1-mesa-dev libegl-dev libx11-dev libxext-dev libasound2-dev

      - name: Use GCC 14
        # The native reference and the sandboxed core must come from the same
        # compiler (docs/BUILDING.md), and miniBox builds the sandbox's C++
        # library for whatever gcc is first on PATH.
        run: |
          mkdir -p "$HOME/gcc14"
          for t in gcc:gcc-14 g++:g++-14 cc:gcc-14 c++:g++-14 cpp:cpp-14; do
            ln -sf "/usr/bin/${t#*:}" "$HOME/gcc14/${t%%:*}"
          done
          echo "$HOME/gcc14" >> "$GITHUB_PATH"
          "$HOME/gcc14/gcc" -dumpfullversion

      - name: Cache Qt
        uses: actions/cache@v4
        with:
          path: ~/qt
          key: qt-6.12.0-linux-aqt-3.3.0

      - name: Build Chimera (the engine, chimera-run and the window)
        run: chimera-checkout/tools/ci-chimera.sh "$HOME/qt"

      - name: Cache miniBox's sandbox toolchain
        uses: actions/cache@v4
        with:
          path: |
            chimera-checkout/extern/chimera-common-minibox/build/meson-linux
            chimera-checkout/extern/chimera-common-minibox/build/meson-cpp
          key: guest-cpp-gcc14-${{ runner.os }}-${{ hashFiles('chimera-checkout/extern/chimera-common-minibox/.git') }}-${{ hashFiles('chimera-checkout/extern/chimera-common-minibox/meson.build') }}

      - name: Build miniBox (the sandbox, and its C++ toolchain)
        run: |
          mb="$PWD/chimera-checkout/extern/chimera-common-minibox"
          [ -f "$mb/build/meson-linux/build.ninja" ] || meson setup "$mb/build/meson-linux" "$mb"
          meson compile -C "$mb/build/meson-linux"
          [ -f "$mb/build/meson-cpp/build.ninja" ] || meson setup "$mb/build/meson-cpp" "$mb" -Dguest_cpp=true
          meson compile -C "$mb/build/meson-cpp"

      - name: Build Xenia natively, and the shader tools
        run: sh ./waterbox/build-native.sh

      - name: Build and run the instruction tests natively
        # Their native results are what the sandboxed core is compared with.
        run: |
          sh ./waterbox/build-ppc-tests.sh
          sh ./waterbox/run-ppc-tests.sh

      - name: Build the sandboxed core and the package
        # The commit is the version the package is stamped with: this is the
        # build that is published, so it is what a movie can name. A package
        # built by hand is stamped "+local" instead.
        env:
          CORE_VERSION: ${{ github.sha }}
        run: sh ./waterbox/build-package.sh -r "$GITHUB_WORKSPACE/chimera-checkout"

      - name: Run the test script
        # With no game on the runner every test is skipped but two: the
        # instruction tests, and the check of watched memory. A run in which
        # those did not pass has tested nothing, so they are asked for by
        # name.
        env:
          CHIMERA_ROOT: ${{ github.workspace }}/chimera-checkout
        run: |
          rc=0
          sh ./waterbox/run-gate.sh > gate.out 2>&1 || rc=$?
          cat gate.out
          [ "$rc" -eq 0 ]
          grep -q '^ppc:sandbox  *PASS ' gate.out
          grep -q '^memory:views  *PASS ' gate.out

      - name: Chimera's checks of the package
        # Chimera's own tests of an installed package, run against this one:
        # it can be read, it is built for a sandbox this Chimera runs, and its
        # controllers, settings and file types are well formed.
        env:
          CHIMERA_CORES_DIR: ${{ github.workspace }}/chimera-checkout/build/Cores
        run: chimera-checkout/build/meson-linux/source/ui/test-packages

      - name: Upload the package
        uses: actions/upload-artifact@v7
        with:
          name: xenia-${{ github.sha }}
          path: chimera-checkout/build/Cores/xenia.chimeraCore
          if-no-files-found: error

      - name: Upload the build logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs
          path: |
            gate.out
            build/*.log

  publish:
    # What passed above, published as this core's own release: a rolling `dev`
    # on every push to main, a dated `nightly-YYYY-MM-DD` from the scheduled
    # run, through the one workflow every Chimera core publishes with.
    name: publish
    needs: [ gate ]
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    uses: ToolAssisted-run/chimera/.github/workflows/publish-core.yml@main
    with:
      core-id: xenia
      artifact: xenia-${{ github.sha }}
      package: xenia.chimeraCore
      kind: ${{ github.event.inputs.kind }}
